version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agentic_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: agenticsdk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d agenticsdk"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentic_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  go-service:
    build:
      context: ./go-service
      dockerfile: Dockerfile
    container_name: agentic_go_service
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/agenticsdk?sslmode=disable
      REDIS_URL: redis:6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      SERVER_PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  python-agent:
    build:
      context: ./python-agent
      dockerfile: Dockerfile
    container_name: agentic_python_agent
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/agenticsdk?sslmode=disable
      REDIS_URL: redis://redis:6379
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      FALLBACK_LLM_API_KEY: ${FALLBACK_LLM_API_KEY}
      FALLBACK_LLM_BASE_URL: ${FALLBACK_LLM_BASE_URL}
      FALLBACK_LLM_MODEL: ${FALLBACK_LLM_MODEL}
      OPENAI_EMBEDDING_API_KEY: ${OPENAI_EMBEDDING_API_KEY}
      OPENAI_EMBEDDING_BASE_URL: ${OPENAI_EMBEDDING_BASE_URL}
      GO_SERVICE_URL: http://go-service:8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      go-service:
        condition: service_healthy

volumes:
  postgres_data:
